[workspace]
resolver = "2"
members = [
    "crates/md-doc",
    "crates/md-geom",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/kaiharimoto/Master-Design"
authors = ["Master Design contributors"]

[workspace.dependencies]
md-doc = { path = "crates/md-doc" }
md-geom = { path = "crates/md-geom" }
md-emit = { path = "crates/md-emit" }
md-mcp = { path = "crates/md-mcp" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
kurbo = "0.11"
ulid = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
